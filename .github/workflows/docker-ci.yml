name: Docker CI

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t todo-practice ./docker-practice-todo

      - name: Run tests inside the container
        run: docker run --rm todo-practice npm test